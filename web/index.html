<script>
'use strict';

/**
    Calculates scaled image size and placement for crop, fit, or manual zoom.

    Full scaled bounds may extend off-screen. Store only their visible intersection.

    @param width Image width in pixels.
    @param height Image height in pixels.
    @param sizing Placement mode: crop, fit or manual zoom.
    @param zoom Manual zoom percentage, from 1 to 500.
    @param position Normalized horizontal and vertical placement, each from 0 to 1.

    @return value - Scaled image bounds and allowed placement ranges in logical panel pixels.
*/
function calculateMediaGeometry(width, height, sizing = 'crop', zoom = 100, position = {
  x: .5,
  y: .5
}) {
  if (!['crop', 'fit', 'manual'].includes(sizing) || !width || !height) {
    throw new Error('Invalid sizing.');
  }
  if (sizing === 'manual' && (!Number.isFinite(zoom) || zoom < 1 || zoom > 500)) {
    throw new Error('Choose zoom from 1 to 500%.');
  }
  let baseScale;
  if (sizing === 'crop') {
    baseScale = Math.max(WIDTH / width, HEIGHT / height);
  } else {
    baseScale = Math.min(WIDTH / width, HEIGHT / height);
  }
  let zoomScale;
  if (sizing === 'manual') {
    zoomScale = zoom / 100;
  } else {
    zoomScale = 1;
  }
  const scale = baseScale * zoomScale;
  const w = Math.max(1, Math.round(width * scale));
  const h = Math.max(1, Math.round(height * scale));
  return {
    width: w,
    height: h,
    x: Math.floor((WIDTH - w) * Math.max(0, Math.min(1, position.x)) + 1e-8),
    y: Math.floor((HEIGHT - h) * Math.max(0, Math.min(1, position.y)) + 1e-8)
  };
}

/**
    Calculates the image region visible inside the panel bounds.

    @param bounds Calculated source-image bounds in logical panel coordinates.

    @return value - Intersection of the positioned image and the logical panel.
*/
function calculateVisibleMediaArea(bounds) {
  const x = Math.max(0, bounds.x);
  const y = Math.max(0, bounds.y);
  return {
    width: Math.min(WIDTH, bounds.x + bounds.width) - x,
    height: Math.min(HEIGHT, bounds.y + bounds.height) - y,
    x,
    y
  };
}

/**
    Returns the stored image region after clipping its placement to the panel.

    @param width Image width in pixels.
    @param height Image height in pixels.
    @param sizing Placement mode: crop, fit or manual zoom.
    @param zoom Manual zoom percentage, from 1 to 500.
    @param position Normalized horizontal and vertical placement, each from 0 to 1.

    @return value - Visible stored rectangle in logical panel pixels after clipping the
                    positioned source.
*/
function getMediaPlacement(width, height, sizing = 'crop', zoom = 100, position = {
  x: .5,
  y: .5
}) {
  return calculateVisibleMediaArea(calculateMediaGeometry(width, height, sizing, zoom, position));
}

/**
    Draws the positioned source image onto the logical panel canvas.

    @param context 2D canvas drawing context or caller-owned callback state.
    @param source Loaded image or video element drawn onto the logical panel canvas.
    @param width Image width in pixels.
    @param height Image height in pixels.
    @param sizing Placement mode: crop, fit or manual zoom.
    @param zoom Manual zoom percentage, from 1 to 500.
    @param position Normalized horizontal and vertical placement, each from 0 to 1.

    @return value - Visible stored rectangle after drawing the source and clearing the
                    surrounding black area.
*/
function drawPlacedMedia(context, source, width, height, sizing = 'crop', zoom = 100, position = {
  x: .5,
  y: .5
}) {
  const bounds = calculateMediaGeometry(width, height, sizing, zoom, position);
  const area = calculateVisibleMediaArea(bounds);
  context.fillStyle = '#000';
  context.fillRect(0, 0, WIDTH, HEIGHT);
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = 'high';
  context.drawImage(
      source, (area.x - bounds.x) * width / bounds.width, (area.y - bounds.y) * height / bounds.height,
      area.width * width / bounds.width, area.height * height / bounds.height, area.x, area.y, area.width,
      area.height);
  return area;
}

/**
    Draws the red boundary separating image data from black panel space.

    @param kind Media category identifying the photo or video editor.
    @param area Visible stored-pixel rectangle within the logical panel.
    @param available Whether a valid source preview is available.
    @param bounds Calculated source-image bounds in logical panel coordinates.
*/
function drawMediaBoundary(kind, area, available, bounds = area) {
  bounds ??= area;
  const outline = document.getElementById(kind + '-outline');
  const editor = document.getElementById(kind + '-editor');
  outline.hidden = !area;
  if (area) {
    Object.assign(outline.style, {
      left: area.x / WIDTH * 100 + '%',
      top: area.y / HEIGHT * 100 + '%',
      width: area.width / WIDTH * 100 + '%',
      height: area.height / HEIGHT * 100 + '%'
    });
  }
  editor.dataset.draggable =
      String(!!(available && area && bounds && (bounds.width !== WIDTH || bounds.height !== HEIGHT)));
  if (!area) {
    document.getElementById(kind + '-drag-hint').textContent = '';
  } else {
    if (bounds.width === WIDTH && bounds.height === HEIGHT) {
      document.getElementById(kind + '-drag-hint').textContent = 'Fills the screen.';
    } else {
      if (bounds.width === WIDTH) {
        document.getElementById(kind + '-drag-hint').textContent = 'Drag vertically.';
      } else {
        if (bounds.height === HEIGHT) {
          document.getElementById(kind + '-drag-hint').textContent = 'Drag horizontally.';
        } else {
          document.getElementById(kind + '-drag-hint').textContent = 'Drag to position.';
        }
      }
    }
  }
}

/**
    Lets pointer dragging adjust the source placement in an upload preview.

    @param target Preview element that receives pointer dragging.
    @param getArea Callback returning the current draggable image bounds.
    @param isAvailable Callback reporting whether a preview is available.
    @param move Callback applying the updated normalized drag position.
*/
function enableMediaDragging(target, getArea, isAvailable, move) {
  let drag = null;
  /**
      Clamps dragged placement to the available image movement range.

      @param value Value to encode, display or apply.
      @param space Available travel distance along this placement axis, in pixels.

      @return value - Normalized drag position clamped to the supported travel range.
  */
  const clamp = (value, space) => Math.max(Math.min(0, space), Math.min(Math.max(0, space), value));
  /**
      Converts pointer coordinates into logical panel coordinates.

      @param event Video event name to wait for.

      @return value - Pointer coordinates converted to logical panel pixels.
  */
  const coordinates = event => {
    const rect = target.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * WIDTH / rect.width,
      y: (event.clientY - rect.top) * HEIGHT / rect.height
    };
  };
  /**
      Ends pointer dragging and releases the active pointer capture.

      @param event Video event name to wait for.
  */
  const finish = event => {
    if (!drag || event.pointerId !== drag.id) {
      return;
    }
    drag = null;
    target.dataset.dragging = 'false';
    if (target.hasPointerCapture(event.pointerId)) {
      target.releasePointerCapture(event.pointerId);
    }
  };
  target.addEventListener('pointerdown', event => {
    if (!isAvailable() || event.isPrimary === false || (event.button !== undefined && event.button !== 0)) {
      return;
    }
    const area = getArea();
    if (!area || (area.width === WIDTH && area.height === HEIGHT)) {
      return;
    }
    const point = coordinates(event);
    if (point.x < area.x || point.x > area.x + area.width || point.y < area.y ||
        point.y > area.y + area.height) {
      return;
    }
    drag = {id: event.pointerId, point, area};
    target.setPointerCapture(event.pointerId);
    target.dataset.dragging = 'true';
    event.preventDefault();
  });
  target.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) {
      return;
    }
    const current = getArea();
    if (!isAvailable() || !current || current.width !== drag.area.width ||
        current.height !== drag.area.height) {
      finish(event);
      return;
    }
    const point = coordinates(event);
    const area = drag.area;
    move(
        clamp(Math.round(area.x + point.x - drag.point.x), WIDTH - area.width),
        clamp(Math.round(area.y + point.y - drag.point.y), HEIGHT - area.height));
    event.preventDefault();
  });
  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    target.addEventListener(name, finish);
  }

  target.addEventListener('keydown', event => {
    if (!isAvailable()) {
      return;
    }
    const area = getArea();
    if (!area) {
      return;
    }
    let step;
    if (event.shiftKey) {
      step = 10;
    } else {
      step = 1;
    }
    const delta = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [
                     0, step
                   ]}[event.key];
    if (!delta) {
      return;
    }
    const x = clamp(area.x + delta[0], WIDTH - area.width);
    const y = clamp(area.y + delta[1], HEIGHT - area.height);
    if (x !== area.x || y !== area.y) {
      move(x, y);
      event.preventDefault();
    }
  });
}

/**
    Copies only the visible stored image region into an encoding canvas.

    @param canvas Canvas receiving prepared or preview pixels.
    @param area Visible stored-pixel rectangle within the logical panel.

    @return value - Canvas containing only the visible image rectangle to be stored.
*/
function createStoredPreviewCanvas(canvas, area) {
  if (area.width === WIDTH && area.height === HEIGHT) {
    return canvas;
  }
  const stored = document.createElement('canvas');
  stored.width = area.width;
  stored.height = area.height;
  stored.getContext('2d').drawImage(
      canvas, area.x, area.y, area.width, area.height, 0, 0, area.width, area.height);
  return stored;
}



const WIDTH = 128;
const HEIGHT = 256;
const RGBA_CHANNELS = 4;
const RGB_CHANNELS = 3;
const UPLOAD_TIMEOUT_MS = 60000;
const fileInput = document.getElementById('photo');
const preview = document.getElementById('preview');
const uploadButton = document.getElementById('upload');
const statusText = document.getElementById('status');
const context = preview.getContext('2d', { willReadFrequently: true });
let prepared = false;
let preparing = false;
let uploading = false;
let selectionRevision = 0;
let photoSource = null;
let photoArea = null;
let photoGeometry = null;
let photoPosition = {x: .5, y: .5};
const photoSizing = document.getElementById('photo-sizing');
const photoZoom = document.getElementById('photo-zoom');
const photoFormat = document.getElementById('photo-format');
const photoQuality = document.getElementById('photo-jpeg-quality');
const photoName = document.getElementById('photo-name');

/**
    Updates input availability while a photo is prepared or sent.

    File selection remains available during decoding so a newer choice can replace
    a slow image. An active upload locks both controls until its request finishes.
*/
function updatePhotoControls() {
    fileInput.disabled = uploading || videoBusy;
    for (const control of [photoSizing, photoFormat, photoQuality, photoName]) {
        control.disabled = uploading || videoBusy;
    }
    photoZoom.disabled = uploading || videoBusy || photoSizing.value !== 'manual';
    photoQuality.disabled = uploading || videoBusy || photoFormat.value !== 'jpeg';
    uploadButton.disabled = !prepared || preparing || uploading || videoBusy;
}



/**
    Decodes the selected image and prepares the upload preview.

    A selection revision prevents an earlier asynchronous decode from replacing a
    newer choice. Temporary object URLs are released after decoding. Failed images
    leave uploading disabled until another image is successfully prepared.

    @return Promise<void> - Completes after preparing the current choice or displaying an error.
*/
async function preparePhotoPreview() {
    const revision = ++selectionRevision;
    const file = fileInput.files[0];
    let objectUrl = '';

    prepared = false;
    preparing = true;
    preview.hidden = true;
    photoSource = null;
    photoArea = null;
    drawMediaBoundary('photo', null, false);
    updatePhotoControls();
    try {
        if (!file) {
            statusText.textContent = 'Choose a photo.';
            return;
        }
        statusText.textContent = 'Preparing photo…';
        objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.src = objectUrl;
        await image.decode();
        if (revision !== selectionRevision) {
            return;
        }
        if (!image.naturalWidth || !image.naturalHeight) {
            throw new Error('The image has no readable pixels.');
        }

        // Composite before extracting bytes so transparent regions display as black.
        photoSource = image;
        photoPosition = {x: .5, y: .5};
        redrawPhoto();
        prepared = true;
        preview.hidden = false;
        statusText.textContent = 'Ready to upload.';
    } catch (error) {
        if (revision === selectionRevision) {
            statusText.textContent = 'Could not prepare photo: ' + error.message;
        }
    } finally {
        if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
        }
        if (revision === selectionRevision) {
            preparing = false;
            updatePhotoControls();
        }
    }
}

/**
    Uploads a named photo using its selected encoding and saved placement.

    Preparation stores only the visible data rectangle and a small legacy thumbnail.
    The shared media protocol transfers bounded chunks and confirms SD verification
    before reporting success. Failed or canceled transfers retain earlier photos.

    @return Promise<void> - Completes after a saved confirmation or an upload error.
*/
async function uploadPhoto() {
    if (!prepared || preparing || uploading || videoBusy || !photoArea) {
        return;
    }
    const controller = new AbortController();
    const timeout = setTimeout(controller.abort.bind(controller), UPLOAD_TIMEOUT_MS);
    let session = 0;
    uploading = true;
    updateVideoControls();
    try {
        const file = fileInput.files[0];
        const name = photoName.value.trim() || file.name.replace(/\.[^.]+$/, '');
        const clip = await preparePhotoPayload(preview, photoArea, photoFormat.value,
            Number(photoQuality.value), name);
        let acknowledgement = await videoRequest(5, 0, 0, clip.header, controller.signal);
        session = acknowledgement.id;
        if (!Number.isInteger(session) || session <= 0 || acknowledgement.state !== 'receiving' ||
            acknowledgement.offset !== 0 || acknowledgement.total !== clip.payload.length) {
            throw new Error('Unexpected photo start response.');
        }
        for (let offset = 0; offset < clip.payload.length;) {
            const end = Math.min(offset + 6144, clip.payload.length);
            acknowledgement = await videoRequest(2, session, offset, clip.payload.subarray(offset, end), controller.signal);
            if (acknowledgement.id !== session || acknowledgement.offset !== end) {
                throw new Error('Unexpected photo progress response.');
            }
            offset = end;
            statusText.textContent = `Uploading ${Math.floor(offset / clip.payload.length * 100)}%`;
        }
        while (acknowledgement.state === 'verifying') {
            statusText.textContent = 'Verifying SD copy…';
            await new Promise(resolve => setTimeout(resolve, 250));
            acknowledgement = await videoRequest(3, session, 0, new Uint8Array(), controller.signal);
        }
        if (acknowledgement.state !== 'saved' || !acknowledgement.photoId || acknowledgement.id !== session) {
            throw new Error('The Pico did not confirm a saved photo.');
        }
        session = 0;
        statusText.textContent = 'Photo saved and verified. ' + acknowledgement.warning;
    } catch (error) {
        statusText.textContent = 'Photo upload failed: ' + error.message;
    } finally {
        clearTimeout(timeout);
        if (session) {
            try {
                await videoRequest(4, session, 0, new Uint8Array(), new AbortController().signal);
            } catch (error) {
                // An unreachable receiving session is also released by the Pico's inactivity deadline.
            }
        }
        uploading = false;
        updateVideoControls();
    }
}

fileInput.addEventListener('change', preparePhotoPreview);
uploadButton.addEventListener('click', uploadPhoto);

const videoFile = document.getElementById('video-file');
const videoSource = document.getElementById('video-source');
const videoCanvas = document.getElementById('video-preview');
videoCanvas.width = WIDTH;
videoCanvas.height = HEIGHT;
const videoCtx = videoCanvas.getContext('2d', {willReadFrequently: true});
const videoFps = document.getElementById('video-fps');
const videoSeconds = document.getElementById('video-seconds');
const videoFormat = document.getElementById('video-format');
const jpegQuality = document.getElementById('jpeg-quality');
const videoPingpong = document.getElementById('video-pingpong');
const videoName = document.getElementById('video-name');
const videoSend = document.getElementById('video-send');
const videoCancel = document.getElementById('video-cancel');
const videoProgress = document.getElementById('video-progress');
const videoStatus = document.getElementById('video-status');
let videoBusy = false;
let videoAbort = null;
let previewUrl = '';
let videoArea = null;
let videoGeometry = null;
let videoPosition = {x: .5, y: .5};

const videoZoom = document.getElementById('video-zoom');
/**
    Provides RGB pixel conversion, indexed JPEG records and checked upload envelopes.

    Encoders use explicit little-endian fields shared with the firmware protocol.
    Frame records are independent so the Pico can verify and seek them without
    retaining a complete video in RAM.
*/
const VideoCodec = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let bit = 0; bit < 8; bit++) {
      if (c & 1) {
        c = (c >>> 1) ^ 0xedb88320;
      } else {
        c = c >>> 1;
      }
    }
    table[i] = c >>> 0;
  }

  /**
      Updates the browser's running CRC32 with a byte span.

      @param bytes Input byte array or byte count to format, as required by this operation.
      @param previous Previously finalized CRC32, or zero to begin a new checksum.

      @return value - Finalized unsigned CRC32 of these bytes, optionally continuing the prior
                      checksum.
  */
  function calculateCrc32(bytes, previous = 0) {
    let c = (previous ^ 0xffffffff) >>> 0;
    for (const b of bytes) {
      c = table[(c ^ b) & 255] ^ (c >>> 8);
    }
    return (c ^ 0xffffffff) >>> 0;
  }

  /**
      Encodes canvas pixels in the selected raw transfer format.

      Drops the already-composited alpha channel. RGB565 uses little-endian
      R5G6B5 words, while RGB888 preserves the browser red/green/blue byte order.

      @param rgba Source canvas pixels in RGBA byte order.
      @param format Stored pixel format selected for the prepared media.

      @return value - RGB888 or little-endian RGB565 bytes converted from canvas RGBA pixels.
  */
  function encodeFramePixels(rgba, format) {
    let pixelBytes;
    if (format === 'rgb565') {
      pixelBytes = 2;
    } else {
      pixelBytes = 3;
    }
    const out = new Uint8Array(rgba.length / 4 * pixelBytes);
    for (let s = 0, d = 0; s < rgba.length; s += 4) {
      if (format === 'rgb565') {
        const p = ((rgba[s] >> 3) << 11) | ((rgba[s + 1] >> 2) << 5) | (rgba[s + 2] >> 3);
        out[d++] = p & 255;
        out[d++] = p >>> 8;
      } else {
        out[d++] = rgba[s];
        out[d++] = rgba[s + 1];
        out[d++] = rgba[s + 2];
      }
    }

    return out;
  }

  /**
      Wraps a browser upload message with its operation and session fields.

      @param op Protocol operation identifier.
      @param id Saved media library identifier; valid IDs are nonzero.
      @param offset Byte offset within the prepared payload or requested upload.
      @param body Binary request payload.

      @return value - Binary upload request header followed by its optional body.
  */
  function buildUploadDescriptor(op, id = 0, offset = 0, body = new Uint8Array()) {
    const out = new Uint8Array(9 + body.length);
    const v = new DataView(out.buffer);
    out[0] = op;
    v.setUint32(1, id, true);
    v.setUint32(5, offset, true);
    out.set(body, 9);
    return out;
  }

  /**
      Builds a checked seek-index entry for each compressed frame.

      Offsets skip the complete index and each preceding eight-byte frame record
      header. The entry checksum covers offset, length and frame ordinal so the
      Pico can validate a seek without scanning all earlier image records.

      @param lengths Encoded byte length of each independently compressed JPEG frame.

      @return value - JPEG frame index containing the offset and length of each encoded frame.
  */
  function encodeJpegFrameIndex(lengths) {
    const out = new Uint8Array(lengths.length * 12);

    // Write the fixed binary fields explicitly; the controller expects little-endian values.
    const v = new DataView(out.buffer);
    let offset = out.length;
    lengths.forEach((length, i) => {
      const entry = new Uint8Array(12);
      const e = new DataView(entry.buffer);
      e.setUint32(0, offset, true);
      e.setUint32(4, length, true);
      e.setUint32(8, i, true);
      v.setUint32(i * 12, offset, true);
      v.setUint32(i * 12 + 4, length, true);
      v.setUint32(i * 12 + 8, calculateCrc32(entry), true);
      offset += 8 + length;
    });
    return out;
  }

  /**
      Validates the browser's JPEG encoding against the Pico decoder's supported format.

      Checks framing and walks marker lengths up to the baseline frame header.
      Progressive or mismatched dimensions are rejected before upload; the Pico
      decoder and stored checksums validate the actual encoded frame content.

      @param frame Raw RGB888 frame or encoded JPEG frame being processed.
      @param width Image width in pixels.
      @param height Image height in pixels.

      @return true - The frame is a supported baseline JPEG with the requested dimensions.
      @return false - The frame markers, encoding or dimensions are unsupported or malformed.
  */
  function validateBaselineJpeg(frame, width = WIDTH, height = HEIGHT) {
    if (frame.length < 4 || frame[0] !== 255 || frame[1] !== 216 || frame[frame.length - 2] !== 255 ||
        frame[frame.length - 1] !== 217) {
      return false;
    }
    let i = 2;
    while (i + 4 <= frame.length) {
      if (frame[i++] !== 255) {
        return false;
      }
      while (frame[i] === 255) {
        i++;
      }
      const marker = frame[i++];
      if (marker === 0xda || marker === 0xd9) {
        return false;
      }
      if (i + 2 > frame.length) {
        return false;
      }
      const length = (frame[i] << 8) | frame[i + 1];
      if (length < 2 || i + length > frame.length) {
        return false;
      }
      if (marker === 0xc0) {
        return length >= 8 && frame[i + 2] === 8 && ((frame[i + 3] << 8) | frame[i + 4]) === height &&
            ((frame[i + 5] << 8) | frame[i + 6]) === width && frame[i + 7] === 3;
      }
      if (marker >= 0xc1 && marker <= 0xcf && ![0xc4, 0xc8, 0xcc].includes(marker)) {
        return false;
      }
      i += length;
    }

    return false;
  }

  /**
      Builds the versioned photo or video metadata descriptor.

      @param frames Prepared frames or number of frames described by the media header.
      @param fps Requested video frames per second.
      @param format Stored pixel format selected for the prepared media.
      @param pingpong Whether the saved video plays forward and then backward.
      @param bytes Input byte array or byte count to format, as required by this operation.
      @param checksum Expected CRC32 checksum of the media payload.
      @param quality JPEG encoder quality; zero means unknown or not applicable.
      @param width Image width in pixels.
      @param height Image height in pixels.
      @param left Left edge of the stored image rectangle, in panel pixels.
      @param top Top edge of the stored image rectangle, in panel pixels.

      @return value - Serialized media descriptor including dimensions, playback, placement and
                      CRC32.
*/
function encodeMediaDescriptor(
    frames, fps, format, pingpong, bytes, checksum, quality = 0, width = WIDTH, height = HEIGHT,
    left = Math.floor((WIDTH - width) / 2), top = Math.floor((HEIGHT - height) / 2)) {
  const out = new Uint8Array(36);

  // Write the fixed binary fields explicitly; the controller expects little-endian values.
  const v = new DataView(out.buffer);
  let savedQuality;
  if (format === 'jpeg') {
    savedQuality = quality;
  } else {
    savedQuality = 0;
  }
  if (!Number.isInteger(savedQuality) || savedQuality < 0 || savedQuality > 95) {
    throw new Error('Invalid saved JPEG quality.');
  }
  if (!Number.isInteger(left) || !Number.isInteger(top) || left < 0 || top < 0 || left + width > WIDTH ||
      top + height > HEIGHT) {
    throw new Error('Invalid placement.');
  }
  const placed = left !== Math.floor((WIDTH - width) / 2) || top !== Math.floor((HEIGHT - height) / 2);
  let version;
  if (placed) {
    version = 4;
  } else {
    if (format === 'jpeg') {
      if (savedQuality) {
        version = 3;
      } else {
        version = 2;
      }
    } else {
      version = 1;
    }
  }
  let loopFlag;
  if (pingpong) {
    loopFlag = 1;
  } else {
    loopFlag = 0;
  }
  out.set([
    72, 55, 53, 77, version, 2, {rgb888: 1, rgb565: 2, jpeg: 3}[format],
    (savedQuality << 1) | loopFlag
  ]);
  if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1 || width > WIDTH ||
      height > HEIGHT) {
    throw new Error('Invalid stored dimensions.');
  }
  let encodedWidth;
  if (placed) {
    encodedWidth = (width - 1) | (left << 7);
  } else {
    encodedWidth = width;
  }
  v.setUint16(8, encodedWidth, true);
  let encodedHeight;
  if (placed) {
    encodedHeight = (height - 1) | (top << 8);
  } else {
    encodedHeight = height;
  }
  v.setUint16(10, encodedHeight, true);
  v.setUint32(12, frames, true);
  v.setUint32(16, fps, true);
  v.setUint32(20, 1, true);
  v.setUint32(24, bytes, true);
  v.setUint32(28, 0, true);
  v.setUint32(32, checksum, true);
  return out;
}
  return {calculateCrc32, encodeFramePixels, encodeMediaDescriptor, buildUploadDescriptor,
          encodeJpegFrameIndex, validateBaselineJpeg};
})();

/**
    Stops video preparation when the user has canceled it.

    @param signal Abort signal used to cancel preparation, waits or uploads.
*/
function throwIfUploadCanceled(signal) {
  if (signal.aborted) {
    throw new Error('canceled');
  }
}

/**
    Waits for a video event with cancellation, error, and timeout handling.

    Installs listeners before starting the action so an immediate event is not
    missed. Completion, failure and cancellation all remove those listeners and
    the deadline; an already canceled signal prevents the action from starting.

    @param video Browser video element used as the source frame.
    @param event Video event name to wait for.
    @param action Callback that starts the asynchronous operation being awaited.
    @param signal Abort signal used to cancel preparation, waits or uploads.

    @return value - Promise resolved when the requested video event occurs; rejected on error,
                    cancellation or timeout.
*/
function waitForVideoEvent(video, event, action, signal) {
  return new Promise((resolve, reject) => {
    let timer;
    /**
        Completes the pending wait and removes its event handlers and deadline.

        @param error Original browser storage or network error to report.
    */
    const finish = error => {
      clearTimeout(timer);
      video.removeEventListener(event, done);
      video.removeEventListener('error', failed);
      signal.removeEventListener('abort', aborted);
      if (error) {
        reject(error);
      } else {
        resolve();
      }
    };
    /**
        Completes the pending video event wait successfully.
    */
    const done = () => finish();
    /**
        Rejects the pending wait when the browser cannot decode the video.
    */
    const failed = () => finish(new Error('This browser could not decode the video. Try an H.264 MP4.'));
    /**
        Cancels the pending video event wait.
    */
    const aborted = () => finish(new Error('canceled'));
    video.addEventListener(event, done, {once: true});
    video.addEventListener('error', failed, {once: true});
    signal.addEventListener('abort', aborted, {once: true});
    timer = setTimeout(() => finish(new Error('Video decoding timed out. Try a different MP4.')), 30000);
    if (signal.aborted) {
      aborted();
    } else {
      try {
        action();
      } catch (e) {
        finish(e);
      }
    }
  });
}

/**
    Stages encoded video frames in the browser while keeping upload reads bounded.

    Small clips use blobs in RAM. Larger clips spill to a temporary IndexedDB
    database, which is disposed after upload or cancellation. The payload exposes
    the same bounded slice interface in both modes, including indexed JPEG data.
*/
class VideoFrameStore {
  /**
      Initializes bounded video preparation storage and its memory limit.

      @param signal Abort signal used to cancel preparation, waits or uploads.
      @param limit Maximum frame bytes retained in RAM before spilling to IndexedDB.
  */
  constructor(signal, limit = 128 * 1024 * 1024) {
    this.signal = signal;
    this.limit = limit;
    this.records = [];
    this.starts = [];
    this.size = 0;
    this.db = null;
    this.name = null;
    this.cache = null;
  }

  /**
      Explains unavailable browser staging storage and its recovery options.

      @param error Original browser storage or network error to report.

      @return value - Error explaining why browser temporary frame storage failed.
  */
  storageError(error) {
    let message;
    if (error && error.name === 'QuotaExceededError') {
      message =
          'Not enough temporary browser storage. Free space, reduce duration/FPS, or select JPEG.';
    } else {
      message =
          'Temporary browser storage is unavailable. Enable site storage, reduce duration/FPS, or select JPEG.';
    }
    return new Error(message);
  }

  /**
      Moves prepared chunks from RAM into temporary browser database storage.

      Opens a unique per-job database and copies existing blobs before releasing
      their RAM references. Failed storage operations terminate preparation; the
      owning job closes and disposes the database during cleanup.

      @return Promise<void> - Completes after existing records have moved to browser storage.
  */
  async spill() {
    if (this.db) {
      return;
    }
    throwIfUploadCanceled(this.signal);
    if (typeof indexedDB === 'undefined') {
      throw this.storageError();
    }
    this.name = `hub75-video-temp-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    try {
      this.db = await new Promise((resolve, reject) => {
        const request = indexedDB.open(this.name, 1);
        request.onupgradeneeded = () => request.result.createObjectStore('frames');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      for (let i = 0; i < this.records.length; i++) {
        throwIfUploadCanceled(this.signal);
        await this.transaction('readwrite', store => store.put(this.records[i], i));
        this.records[i] = null;
      }
      this.records = [];
    } catch (error) {
      if (this.signal.aborted) {
        throw new Error('canceled');
      }
      throw this.storageError(error);
    }
  }

  /**
      Runs a bounded operation against the temporary browser staging database.

      Captures the individual request result but waits for transaction completion
      before reporting success. Aborts carry the final storage failure, including
      quota exhaustion, so partially completed writes cannot look successful.

      @param mode IndexedDB transaction mode: readonly or readwrite.
      @param action Callback that starts the asynchronous operation being awaited.

      @return value - Promise for completion of the requested temporary-storage transaction.
  */
  transaction(mode, action) {
    return new Promise((resolve, reject) => {
      let transaction;
      let result;
      try {
        transaction = this.db.transaction('frames', mode);
        const request = action(transaction.objectStore('frames'));
        request.onsuccess = () => {
          result = request.result;
        };
        transaction.oncomplete = () => resolve(result);
        transaction.onabort = () => reject(transaction.error);
        transaction.onerror = () => { return; };  // Abort carries the final failure, including quota errors.
      } catch (error) {
        reject(error);
      }
    });
  }

  /**
      Adds a prepared chunk while enforcing staging storage limits.

      Crossing the RAM threshold moves existing records into IndexedDB. The byte
      offset table advances only after the new blob is retained successfully,
      and cancellation is checked before and after asynchronous storage work.

      @param record Encoded frame record to append to temporary storage.

      @return Promise - Resolves when this asynchronous operation completes; rejects if the
                        operation fails or is canceled.
  */
  async append(record) {
    throwIfUploadCanceled(this.signal);
    if (!this.db && this.size + record.size > this.limit) {
      await this.spill();
    }
    try {
      if (this.db) {
        await this.transaction('readwrite', store => store.put(record, this.starts.length));
      } else {
        this.records.push(record);
      }
    } catch (error) {
      throw this.storageError(error);
    }

    this.starts.push(this.size);
    this.size += record.size;
    throwIfUploadCanceled(this.signal);
  }

  /**
      Reads one staged frame record by index.

      RAM records are borrowed directly. Database reads cache the most recently
      requested blob because consecutive upload chunks usually share a frame.
      Missing data terminates the job rather than uploading an incomplete record.

      @param index Zero-based staged frame index.

      @return value - Promise resolving to: encoded frame record at the requested zero-based
                      index.
  */
  async record(index) {
    throwIfUploadCanceled(this.signal);
    if (!this.db) {
      return this.records[index];
    }
    if (this.cache && this.cache.index === index) {
      return this.cache.blob;
    }
    let blob;
    try {
      blob = await this.transaction('readonly', store => store.get(index));
    } catch (error) {
      throw this.storageError(error);
    }

    throwIfUploadCanceled(this.signal);
    if (!blob) {
      throw new Error('A prepared video frame is missing. Prepare the clip again.');
    }
    this.cache = {index, blob};
    return blob;
  }

  /**
      Exposes the staged video payload for bounded upload reads.

      A RAM-backed job borrows the frame blobs through a composite Blob. A database
      job maps each requested byte range across its optional index and stored frame
      records, caching the current record to avoid repeated reads between chunks.

      @param index Optional JPEG seek-index bytes prepended to staged frame records.

      @return value - Prepared payload combining the frame index and all stored frame records.
  */
  payload(index = new Uint8Array()) {
    const owner = this;
    if (!this.db) {
      return new Blob([index, ...this.records]);
    }
    return {
      size: index.length + this.size,
      /**
          Returns a bounded slice of the staged video payload.

          @param start Inclusive first byte offset of the payload slice.
          @param end Exclusive final byte offset of the payload slice.

          @return value - Payload slice covering the requested byte range.
      */
      slice(start, end) {
        return {
          /**
              Reads the selected staged payload range into a byte buffer.

              @return value - Promise resolving to: arrayBuffer containing all bytes represented by this
                              prepared payload.
          */
          async arrayBuffer() {
            throwIfUploadCanceled(owner.signal);
            end = Math.min(end, index.length + owner.size);
            const out = new Uint8Array(Math.max(0, end - start));
            let cursor = start;
            if (cursor < index.length) {
              const stop = Math.min(end, index.length);
              out.set(index.subarray(cursor, stop));
              cursor = stop;
            }
            let low = 0;
            let high = owner.starts.length;
            while (low < high) {
              const mid = (low + high) >>> 1;
              if (owner.starts[mid] <= cursor - index.length) {
                low = mid + 1;
              } else {
                high = mid;
              }
            }

            let frame = Math.max(0, low - 1);
            while (cursor < end) {
              const blob = await owner.record(frame);
              const offset = cursor - index.length - owner.starts[frame];
              const count = Math.min(end - cursor, blob.size - offset);
              if (count <= 0) {
                throw new Error('Invalid prepared video offset.');
              }
              out.set(new Uint8Array(await blob.slice(offset, offset + count).arrayBuffer()), cursor - start);
              cursor += count;
              frame++;
            }

            throwIfUploadCanceled(owner.signal);
            return out.buffer;
          }
        };
      }
    };
  }

  /**
      Releases temporary chunks and browser database resources.

      Closes the connection before deleting its uniquely named staging database.
      Blocked deletion or storage errors resolve cleanup rather than keeping the
      controls locked after the upload itself has ended.

      @return Promise<void> - Completes after releasing the job's temporary storage references.
  */
  async dispose() {
    this.records = [];
    this.starts = [];
    this.cache = null;
    if (this.db) {
      this.db.close();
      this.db = null;
    }
    if (this.name) {
      const name = this.name;
      this.name = null;
      // No other tab opens this job's database; close our connection before deletion.
      await new Promise(resolve => {
        try {
          const request = indexedDB.deleteDatabase(name);
          request.onsuccess = request.onerror = request.onblocked = resolve;
        } catch (_) {
          resolve();
        }
      });
    }
  }
}

/**
    Reads the browser's video encoding and playback options.

    Checks the requested rate, duration and JPEG encoder range before decoding.
    Source duration is applied separately during preparation, where a shorter
    source produces fewer frames than the selected maximum permits.

    @return object - Validated FPS, duration, pixel format, JPEG quality and loop mode.
*/
function readVideoUploadOptions() {
    const fps = Number(videoFps.value);
    const seconds = Number(videoSeconds.value);
    const quality = Number(jpegQuality.value);
    const format = videoFormat.value;
    if (!Number.isInteger(fps) || fps < 1 || fps > 60) {
        throw new Error('Choose an FPS from 1 to 60.');
    }
    if (!Number.isFinite(seconds) || seconds < 0.1 || seconds > 600) {
        throw new Error('Choose a duration from 0.1 to 600 seconds.');
    }
    if (!['rgb565', 'rgb888', 'jpeg'].includes(format)) {
        throw new Error('Choose a supported format.');
    }
    if (format === 'jpeg' && (!Number.isInteger(quality) || quality < 1 || quality > 95)) {
        throw new Error('Choose JPEG quality from 1 to 95.');
    }
    const sizing = videoSizing.value;
    const zoom = Number(videoZoom.value);
    if (!['crop', 'fit', 'manual'].includes(sizing) ||
        (sizing === 'manual' && (!Number.isFinite(zoom) || zoom < 1 || zoom > 500))) {
        throw new Error('Choose crop, fit or manual zoom from 1 to 500%.');
    }
    return {fps, seconds, quality, format, pingpong: videoPingpong.checked,
            sizing, zoom, position: {...videoPosition}};
}

/**
    Draws a source video frame using the chosen sizing and placement.

    @param video Browser video element used as the source frame.
    @param sizing Placement mode: crop, fit or manual zoom.
    @param zoom Manual zoom percentage, from 1 to 500.
    @param position Normalized horizontal and vertical placement, each from 0 to 1.

    @return value - Visible stored rectangle after rendering the current source video frame.
*/
function drawVideoFrame(video, sizing = 'crop', zoom = 100, position = {
  x: .5,
  y: .5
}) {
  const bounds = calculateMediaGeometry(video.videoWidth, video.videoHeight, sizing, zoom, position);
  const area = drawPlacedMedia(videoCtx, video, video.videoWidth, video.videoHeight, sizing, zoom, position);
  drawMediaBoundary('video', area, !videoBusy && !uploading, bounds);
  return area;
}

/**
    Prepares raw or independently compressed frames from the start of a local video.

    Browser decoding supplies sampled frames at the requested FPS up to the selected
    duration or source end. Frames are staged before transfer so payload size and CRC
    are known. Indexed JPEG includes checked record headers and a seek index.
    Source URLs and temporary browser storage are released when preparation fails.

    @param file Selected local video file.
    @param options Validated video encoding and timing settings.
    @param signal Cancellation signal shared by preparation and transfer.

    @return Promise<object> - Payload, frame count, metadata header and storage cleanup callback.
*/
async function prepareBrowserVideo(file, options, signal) {
    const video = document.createElement('video');
    const url = URL.createObjectURL(file);
    const records = new VideoFrameStore(signal);
    const lengths = [];
    let checksum = 0;
    let prepared = false;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    try {
        await waitForVideoEvent(video, 'loadeddata', () => {
            video.src = url;
            video.load();
        }, signal);
        if (!Number.isFinite(video.duration) || video.duration <= 0 || !video.videoWidth || !video.videoHeight) {
            throw new Error('Could not read this video. Try an H.264 MP4.');
        }
        const duration = Math.min(video.duration, options.seconds);
        const frames = Math.max(1, Math.ceil(duration * options.fps - 1e-8));
        const area = getMediaPlacement(video.videoWidth, video.videoHeight, options.sizing,
            options.zoom, options.position);
        const encodedCanvas = createStoredPreviewCanvas(videoCanvas, area);
        const encodedContext = encodedCanvas.getContext('2d', {willReadFrequently: true});
        let rawPixelBytes = 3;
        if (options.format === 'rgb565') {
            rawPixelBytes = 2;
        }
        if (options.format !== 'jpeg' && frames * area.width * area.height * rawPixelBytes > records.limit) {
            await records.spill();
        }
        for (let i = 0; i < frames; i++) {
            throwIfUploadCanceled(signal);
            const target = i / options.fps;
            if (i || Math.abs(video.currentTime - target) > 0.0001) {
                await waitForVideoEvent(video, 'seeked', () => { video.currentTime = target; }, signal);
            }
            drawVideoFrame(video, options.sizing, options.zoom, options.position);
            if (encodedCanvas !== videoCanvas) {
                encodedContext.drawImage(videoCanvas, area.x, area.y, area.width, area.height,
                    0, 0, area.width, area.height);
            }
            let frame;
            if (options.format === 'jpeg') {
                const blob = await new Promise(resolve => encodedCanvas.toBlob(resolve, 'image/jpeg', options.quality / 100));
                throwIfUploadCanceled(signal);
                if (!blob || blob.type !== 'image/jpeg') {
                    throw new Error('JPEG encoding is unavailable. Select RGB565.');
                }
                frame = new Uint8Array(await blob.arrayBuffer());
                if (frame.length > 128 * 1024 || !VideoCodec.validateBaselineJpeg(frame, area.width, area.height)) {
                    throw new Error('The browser produced an unsupported JPEG. Select RGB565.');
                }
                const header = new Uint8Array(8);
                const view = new DataView(header.buffer);
                view.setUint32(0, frame.length, true);
                view.setUint32(4, VideoCodec.calculateCrc32(frame), true);
                await records.append(new Blob([header, frame]));
                lengths.push(frame.length);
            } else {
                frame = VideoCodec.encodeFramePixels(encodedContext.getImageData(0, 0, area.width, area.height).data, options.format);
                await records.append(new Blob([frame]));
                checksum = VideoCodec.calculateCrc32(frame, checksum);
            }
            videoProgress.value = (i + 1) / frames * 100;
            videoStatus.textContent = `Preparing frame ${i + 1} of ${frames}…`;
            if (i % 8 === 0) {
                await new Promise(resolve => setTimeout(resolve, 0));
            }
        }
        let payload;
        if (options.format === 'jpeg') {
            const index = VideoCodec.encodeJpegFrameIndex(lengths);
            payload = records.payload(index);
            checksum = VideoCodec.calculateCrc32(index);
            for (let i = 0; i < frames; i++) {
                throwIfUploadCanceled(signal);
                checksum = VideoCodec.calculateCrc32(new Uint8Array(await (await records.record(i)).arrayBuffer()), checksum);
            }
        } else {
            payload = records.payload();
        }
        const header = VideoCodec.encodeMediaDescriptor(frames, options.fps, options.format,
            options.pingpong, payload.size, checksum, options.quality, area.width, area.height, area.x, area.y);
        prepared = true;
        return {payload, frames, header, dispose: records.dispose.bind(records)};
    } finally {
        video.pause();
        video.removeAttribute('src');
        video.load();
        URL.revokeObjectURL(url);
        if (!prepared) {
            await records.dispose();
        }
    }
}

/**
    Adds a bounded ASCII name and duration limit to the video start descriptor.

    The zero-filled name field always retains a terminator. Non-ASCII characters
    are replaced consistently with controller naming, and the selected duration
    is recorded independently of the actual saved frame count.

    @param header Video metadata and payload CRC bytes.
    @param name User override or source filename without its extension.
    @param seconds Selected maximum source duration in seconds.

    @return Uint8Array - Named video start body with explicit zero-terminated name storage.
*/
function videoLibraryHeader(header, name, seconds) {
    const out = new Uint8Array(104);
    out.set(header);
    const ascii = name.replace(/[^\x20-\x7e]/g, '_').slice(0, 63);
    for (let i = 0; i < ascii.length; i++) {
        out[36 + i] = ascii.charCodeAt(i);
    }
    new DataView(out.buffer).setUint32(100, Math.round(seconds * 1000), true);
    return out;
}

/**
    Sends one bounded video protocol message and checks the Pico's JSON response.

    A per-request timeout releases the browser when a socket stops responding.
    The caller retains the acknowledged session and byte offset for the next chunk;
    cancellation remains shared with video preparation.

    @param operation Upload start, chunk, status or cancellation operation.
    @param id Active upload session ID, or zero for a new upload.
    @param offset Confirmed payload byte position.
    @param body Optional protocol body bytes.
    @param signal Cancellation signal for the pending HTTP request.

    @return Promise<object> - Parsed acknowledgement containing session, progress and state.
*/
async function sendVideoRequest(operation, id, offset, body, signal) {
    const request = new AbortController();
    const abort = request.abort.bind(request);
    const timer = setTimeout(abort, 30000);
    signal.addEventListener('abort', abort, {once: true});
    try {
        throwIfUploadCanceled(signal);
        const response = await fetch('/api/video', {
            method: 'POST',
            headers: {'Content-Type': 'application/octet-stream'},
            body: VideoCodec.buildUploadDescriptor(operation, id, offset, body),
            signal: request.signal,
            cache: 'no-store'
        });
        if (!response.ok) {
            throw new Error(`Video request failed (HTTP ${response.status}).`);
        }
        const acknowledgement = await response.json();
        if (acknowledgement.error) {
            throw new Error(acknowledgement.error);
        }
        return acknowledgement;
    } finally {
        clearTimeout(timer);
        signal.removeEventListener('abort', abort);
    }
}

/**
    Updates photo and video inputs while preparation or transfer owns the page.
*/
function updateVideoControls() {
    const busy = videoBusy || uploading;
    for (const control of [videoFile, videoFps, videoSeconds, videoFormat, jpegQuality, videoPingpong, videoName, videoSizing, videoZoom]) {
        control.disabled = busy;
    }
    jpegQuality.disabled = busy || videoFormat.value !== 'jpeg';
    videoZoom.disabled = busy || videoSizing.value !== 'manual';
    videoSend.disabled = busy || !videoFile.files.length;
    videoCancel.disabled = !videoBusy;
    updatePhotoControls();
    redrawVideoPreview();
}

/**
    Prepares, transfers and waits for verified publication of the selected video.

    Each HTTP message carries at most 6144 payload bytes. The confirmed byte offset
    advances only after a matching acknowledgement, and verification is polled as a
    separate state. Cancellation or failure attempts to release the Pico's session
    before disposing temporary browser records and unlocking the page.

    @return Promise<void> - Completes after reporting a saved clip or an upload error.
*/
async function uploadVideo() {
    if (videoBusy || uploading || !videoFile.files.length) {
        return;
    }
    let clip = null;
    let session = 0;
    videoBusy = true;
    videoAbort = new AbortController();
    updateVideoControls();
    try {
        const options = readVideoUploadOptions();
        const file = videoFile.files[0];
        const name = videoName.value.trim() || file.name.replace(/\.[^.]+$/, '');
        clip = await prepareBrowserVideo(file, options, videoAbort.signal);
        let acknowledgement = await videoRequest(6, 0, 0,
            videoLibraryHeader(clip.header, name, options.seconds), videoAbort.signal);
        session = acknowledgement.id;
        if (!Number.isInteger(session) || session <= 0 || acknowledgement.state !== 'receiving' ||
            acknowledgement.offset !== 0 || acknowledgement.total !== clip.payload.size) {
            throw new Error('Unexpected upload start response.');
        }
        for (let offset = 0; offset < clip.payload.size;) {
            throwIfUploadCanceled(videoAbort.signal);
            const end = Math.min(offset + 6144, clip.payload.size);
            const bytes = new Uint8Array(await clip.payload.slice(offset, end).arrayBuffer());
            acknowledgement = await videoRequest(2, session, offset, bytes, videoAbort.signal);
            if (acknowledgement.id !== session || acknowledgement.offset !== end) {
                throw new Error('Unexpected upload progress response.');
            }
            offset = end;
            videoProgress.value = offset / clip.payload.size * 100;
            videoStatus.textContent = `Uploading ${Math.floor(videoProgress.value)}%`;
        }
        while (acknowledgement.state === 'verifying') {
            throwIfUploadCanceled(videoAbort.signal);
            videoStatus.textContent = 'Verifying SD copy…';
            await new Promise(resolve => setTimeout(resolve, 250));
            acknowledgement = await videoRequest(3, session, 0, new Uint8Array(), videoAbort.signal);
        }
        if (acknowledgement.id !== session || acknowledgement.state !== 'saved' || !acknowledgement.videoId) {
            throw new Error('The Pico did not confirm a saved video.');
        }
        session = 0;
        videoStatus.textContent = `Saved and verified: ${clip.frames} frames. ` + acknowledgement.warning;
    } catch (error) {
        videoStatus.textContent = 'Video upload failed: ' + error.message;
    } finally {
        if (session) {
            try {
                await videoRequest(4, session, 0, new Uint8Array(), new AbortController().signal);
            } catch (error) {
                // The Pico also releases an inactive receive session when the client cannot reach it.
            }
        }
        if (clip) {
            await clip.dispose();
        }
        videoBusy = false;
        videoAbort = null;
        updateVideoControls();
    }
}

/**
    Cancels the active browser video preparation or upload request.
*/
function cancelVideoUpload() {
    if (videoAbort) {
        videoAbort.abort();
    }
}

/**
    Releases the native source-video preview URL when its file is replaced.
*/
function disposeVideoPreview() {
    videoSource.pause();
    videoSource.removeAttribute('src');
    videoSource.load();
    if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = '';
    }
}

/**
    Shows the selected source video with the centered crop used during encoding.

    Replaces and releases the preceding object URL before attaching the new source.
    The native video supplies decoded pixels to the draggable preview canvas. Upload
    preparation decodes from the beginning and applies the same saved placement.
*/
function prepareVideoPreview() {
    disposeVideoPreview();
    if (videoFile.files.length) {
        previewUrl = URL.createObjectURL(videoFile.files[0]);
        videoSource.src = previewUrl;
        videoSource.hidden = true;
        videoSource.load();
    } else {
        videoSource.hidden = true;
    }
    updateVideoControls();
}

videoFile.addEventListener('change', prepareVideoPreview);
videoSend.addEventListener('click', uploadVideo);
videoCancel.addEventListener('click', cancelVideoUpload);
videoFormat.addEventListener('change', updateVideoControls);
window.addEventListener('pagehide', disposeVideoPreview);

let mediaRequestTail = Promise.resolve();
/**
    Serializes one media protocol request with other browser controls and previews.

    A queued request retains its cancellation signal. The queue is released in all
    success and failure paths so one failed action cannot stall later commands.

    @param operation Binary protocol operation.
    @param id Session, media ID or first control value.
    @param offset Payload offset, page cursor or second control value.
    @param body Optional binary request body.
    @param signal Cancellation signal for this operation.

    @return Promise<object> - Parsed protocol or library response.
*/
async function videoRequest(operation, id, offset, body, signal) {
    const previous = mediaRequestTail;
    let release;
    mediaRequestTail = new Promise(resolve => { release = resolve; });
    await previous;
    try {
        return await sendVideoRequest(operation, id, offset, body, signal);
    } finally {
        release();
    }
}

/**
    Redraws the selected photo and its stored-data boundary after drag or zoom changes.
*/
function redrawPhoto() {
    photoZoom.disabled = uploading || videoBusy || photoSizing.value !== 'manual';
    photoQuality.disabled = uploading || videoBusy || photoFormat.value !== 'jpeg';
    for (const control of [photoSizing, photoFormat, photoName]) {
        control.disabled = uploading || videoBusy;
    }
    if (!photoSource) {
        drawMediaBoundary('photo', null, false);
        return;
    }
    try {
        photoGeometry = calculateMediaGeometry(photoSource.naturalWidth, photoSource.naturalHeight,
            photoSizing.value, Number(photoZoom.value), photoPosition);
        photoArea = drawPlacedMedia(context, photoSource, photoSource.naturalWidth, photoSource.naturalHeight,
            photoSizing.value, Number(photoZoom.value), photoPosition);
        drawMediaBoundary('photo', photoArea, !uploading && !videoBusy, photoGeometry);
    } catch (error) {
        photoArea = null;
        drawMediaBoundary('photo', null, false);
        statusText.textContent = error.message;
    }
}

/**
    Redraws the first source video frame and its editable data rectangle.
*/
function redrawVideoPreview() {
    if (!videoSource.videoWidth || !videoSource.videoHeight || !previewUrl || videoBusy) {
        return;
    }
    try {
        videoGeometry = calculateMediaGeometry(videoSource.videoWidth, videoSource.videoHeight,
            videoSizing.value, Number(videoZoom.value), videoPosition);
        videoArea = drawVideoFrame(videoSource, videoSizing.value, Number(videoZoom.value), videoPosition);
    } catch (error) {
        videoArea = null;
        drawMediaBoundary('video', null, false);
        videoStatus.textContent = error.message;
    }
}

/**
    Builds a photo payload, thumbnail and named start header from the visible rectangle.

    The preview includes generated black borders, while encoded payload pixels cover
    only the saved rectangle. JPEG is a one-entry indexed stream, compatible with the
    same verified storage reader used for videos. All quality and placement fields
    belong to the individual saved photo.

    @param canvas Full logical-panel preview canvas.
    @param area Visible stored rectangle in panel coordinates.
    @param format Selected RGB565, RGB888 or JPEG format.
    @param quality JPEG encoder quality from 1 to 95.
    @param name Optional photo name or filename-derived fallback.

    @return Promise<object> - Named start header and complete photo payload bytes.
*/
async function preparePhotoPayload(canvas, area, format, quality, name) {
    if (!['rgb565', 'rgb888', 'jpeg'].includes(format) ||
        (format === 'jpeg' && (!Number.isInteger(quality) || quality < 1 || quality > 95))) {
        throw new Error('Choose a valid photo format and JPEG quality.');
    }
    const thumbnailCanvas = document.createElement('canvas');
    thumbnailCanvas.width = 16;
    thumbnailCanvas.height = 32;
    const thumbnailContext = thumbnailCanvas.getContext('2d');
    thumbnailContext.drawImage(canvas, 0, 0, 16, 32);
    const thumbnail = VideoCodec.encodeFramePixels(thumbnailContext.getImageData(0, 0, 16, 32).data, 'rgb565');
    const stored = createStoredPreviewCanvas(canvas, area);
    let payload;
    if (format === 'jpeg') {
        const blob = await new Promise(resolve => stored.toBlob(resolve, 'image/jpeg', quality / 100));
        if (!blob || blob.type !== 'image/jpeg') {
            throw new Error('JPEG encoding is unavailable. Select RGB565.');
        }
        const frame = new Uint8Array(await blob.arrayBuffer());
        if (frame.length > 128 * 1024 || !VideoCodec.validateBaselineJpeg(frame, area.width, area.height)) {
            throw new Error('The browser produced an unsupported JPEG. Select RGB565.');
        }
        const record = new Uint8Array(8);
        new DataView(record.buffer).setUint32(0, frame.length, true);
        new DataView(record.buffer).setUint32(4, VideoCodec.calculateCrc32(frame), true);
        payload = new Uint8Array(await new Blob([VideoCodec.encodeJpegFrameIndex([frame.length]), record, frame]).arrayBuffer());
    } else {
        payload = VideoCodec.encodeFramePixels(stored.getContext('2d').getImageData(0, 0, area.width, area.height).data, format);
    }
    const descriptor = VideoCodec.encodeMediaDescriptor(1, 0, format, false, payload.length,
        VideoCodec.calculateCrc32(payload), quality, area.width, area.height, area.x, area.y);
    descriptor[5] = 1;
    const header = new Uint8Array(1124);
    header.set(descriptor);
    const ascii = String(name || 'Photo').replace(/[^\x20-\x7e]/g, '_').slice(0, 63);
    for (let i = 0; i < ascii.length; i++) {
        header[36 + i] = ascii.charCodeAt(i);
    }
    header.set(thumbnail, 100);
    return {header, payload};
}

/**
    Applies a drag update to a media source's normalized placement.

    A full axis cannot move; other axes map the dragged coordinate onto their
    available range, including negative coordinates for off-screen crop areas.

    @param kind Photo or video editor identifier.
    @param x New source left edge in logical pixels.
    @param y New source top edge in logical pixels.
*/
function updateDraggedPlacement(kind, x, y) {
    let geometry = photoGeometry;
    if (kind === 'video') {
        geometry = videoGeometry;
    }
    let horizontal = .5;
    let vertical = .5;
    if (geometry.width !== WIDTH) {
        horizontal = x / (WIDTH - geometry.width);
    }
    if (geometry.height !== HEIGHT) {
        vertical = y / (HEIGHT - geometry.height);
    }
    if (kind === 'photo') {
        photoPosition = {x: horizontal, y: vertical};
        redrawPhoto();
    } else {
        videoPosition = {x: horizontal, y: vertical};
        redrawVideoPreview();
    }
}

photoSizing.addEventListener('change', redrawPhoto);
photoZoom.addEventListener('input', redrawPhoto);
photoFormat.addEventListener('change', redrawPhoto);
videoSizing.addEventListener('change', updateVideoControls);
videoZoom.addEventListener('input', redrawVideoPreview);
videoSource.addEventListener('loadeddata', redrawVideoPreview);
enableMediaDragging(preview, () => photoGeometry, () => !!photoSource && !uploading && !videoBusy,
    (x, y) => updateDraggedPlacement('photo', x, y));
enableMediaDragging(videoCanvas, () => videoGeometry, () => !!videoArea && !uploading && !videoBusy,
    (x, y) => updateDraggedPlacement('video', x, y));

const libraryPages = {
    photo: {history: [0], nextAfter: 0, hasMore: false, ticket: 0, busy: false},
    video: {history: [0], nextAfter: 0, hasMore: false, ticket: 0, busy: false}
};
let galleryBusy = false;

/**
    Sends an empty-body library or control command through the shared request queue.

    @param operation Binary mailbox operation.
    @param id Media ID or first control value.
    @param offset Exclusive page cursor or second control value.

    @return Promise<object> - Parsed bounded library or control response.
*/
function libraryRequest(operation, id = 0, offset = 0) {
    return videoRequest(operation, id, offset, new Uint8Array(), new AbortController().signal);
}

/**
    Formats a byte count for the saved-item and storage summaries.

    @param bytes Nonnegative byte count reported by the controller.

    @return string - Human-readable bytes, KiB, MiB or GiB value.
*/
function formatStorageBytes(bytes) {
    const units = ['B', 'KiB', 'MiB', 'GiB'];
    let value = Number(bytes);
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
    }
    let precision = 0;
    if (unit) {
        precision = 1;
    }
    return value.toFixed(precision) + ' ' + units[unit];
}

/**
    Renders a cached display-mode response without clearing the current summary first.

    @param status Validated display status returned by the controller.
*/
function renderPlaybackStatus(status) {
    const labels = {builtin: 'Built-in', photo: 'Photo', slideshow: 'Slideshow', video: 'Video'};
    document.getElementById('active-mode').textContent = labels[status.mode] || 'Unknown';
    let detail = status.displayedName || '';
    if (status.mode === 'video') {
        if (status.pingPong) {
            detail += ' · Ping-pong';
        } else {
            detail += ' · Loop';
        }
    }
    document.getElementById('active-mode-detail').textContent = detail;
    if (status.displaySettings) {
        const fps = document.getElementById('playback-max-fps');
        fps.value = '';
        if (status.displaySettings.maxFps) {
            fps.value = status.displaySettings.maxFps;
        }
        document.getElementById('panel-brightness').value = status.displaySettings.brightness;
    }
}

/**
    Refreshes active display mode and managed storage totals on demand.

    Requests are serialized with other page actions. Failed reads leave previously
    displayed values visible and report the failure separately from those values.

    @return Promise<void> - Completes after updating the summary or showing an error.
*/
async function refreshSummary() {
    const message = document.getElementById('summary-status');
    try {
        renderPlaybackStatus(await libraryRequest(15));
        const result = await libraryRequest(23);
        if (result.storage && result.storage.available) {
            document.getElementById('storage-usage').textContent = 'Managed files: ' + formatStorageBytes(result.storage.fileBytes);
            document.getElementById('storage-capacity').textContent = 'Allocated: ' + formatStorageBytes(result.storage.allocatedBytes) + ' / ' + formatStorageBytes(result.storage.totalBytes);
        } else {
            document.getElementById('storage-usage').textContent = 'Storage unavailable';
        }
        message.textContent = '';
    } catch (error) {
        message.textContent = 'Could not refresh summary: ' + error.message;
    }
}

/**
    Shows one accessible media tab and requests its latest data.

    @param name Summary, photos or videos tab identifier.
*/
function selectMediaTab(name) {
    for (const candidate of ['summary', 'photos', 'videos']) {
        const active = candidate === name;
        const button = document.getElementById('tab-' + candidate);
        button.setAttribute('aria-selected', String(active));
        button.tabIndex = -1;
        if (active) {
            button.tabIndex = 0;
        }
        document.getElementById('panel-' + candidate).hidden = !active;
    }
    if (name === 'summary') {
        refreshSummary();
    } else if (name === 'photos') {
        loadLibraryPage('photo');
    } else {
        loadLibraryPage('video');
    }
}

/**
    Converts a checked RGB565 preview response into its saved-item canvas.

    @param canvas Destination miniature canvas.
    @param preview Saved image or first-video-frame preview containing base64 RGB565 pixels.
*/
function renderLibraryPreview(canvas, preview) {
    const bytes = Uint8Array.from(atob(preview.pixels), character => character.charCodeAt(0));
    if (preview.width !== 32 || preview.height !== 64 || bytes.length !== preview.width * preview.height * 2) {
        throw new Error('Incomplete preview response.');
    }
    canvas.width = preview.width;
    canvas.height = preview.height;
    const context = canvas.getContext('2d');
    const pixels = context.createImageData(canvas.width, canvas.height);
    for (let source = 0, target = 0; source < bytes.length; source += 2, target += 4) {
        const packed = bytes[source] | bytes[source + 1] << 8;
        const red = packed >>> 11;
        const green = packed >>> 5 & 63;
        const blue = packed & 31;
        pixels.data[target] = red << 3 | red >>> 2;
        pixels.data[target + 1] = green << 2 | green >>> 4;
        pixels.data[target + 2] = blue << 3 | blue >>> 2;
        pixels.data[target + 3] = 255;
    }
    context.putImageData(pixels, 0, 0);
}

/**
    Creates a text-only saved-item card with explicit show and delete actions.

    Metadata names are assigned through textContent. Encoded names and other
    controller values are never interpreted as markup in the page.

    @param kind Photo or video collection identifier.
    @param item Stored item metadata.
    @param displayed ID currently displayed by this collection.

    @return object - Card element and preview canvas to fill asynchronously.
*/
function createLibraryCard(kind, item, displayed) {
    const card = document.createElement('article');
    card.className = 'photo-card';
    if (item.id === displayed) {
        card.className += ' showing';
    }
    const title = document.createElement('h3');
    title.textContent = item.name;
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 64;
    canvas.setAttribute('aria-label', item.name + ' preview');
    const metadata = document.createElement('p');
    let text = item.format + ' · ' + item.width + '×' + item.height;
    if (item.format === 'JPEG') {
        text += ' · Q';
        if (item.jpegQuality) {
            text += item.jpegQuality;
        } else {
            text += 'XX';
        }
    }
    if (kind === 'video') {
        text += ' · ' + (item.fpsNumerator / item.fpsDenominator).toFixed(1) + ' FPS';
        text += ' · ' + (item.durationMillis / 1000).toFixed(1) + ' s';
        if (item.pingPong) {
            text += ' · Ping-pong';
        } else {
            text += ' · Loop';
        }
    }
    metadata.textContent = text + ' · ' + formatStorageBytes(item.bytes);
    const show = document.createElement('button');
    show.type = 'button';
    show.textContent = 'Show';
    show.disabled = !item.valid;
    show.addEventListener('click', () => libraryAction(kind, 'show', item.id));
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'secondary';
    remove.textContent = 'Delete';
    remove.addEventListener('click', () => libraryAction(kind, 'delete', item.id));
    card.append(title, canvas, metadata, show, remove);
    return {card, canvas};
}

/**
    Loads an ordered saved-media page and then its previews without clearing old data early.

    Page cursors are bounded media IDs. Preview requests are sequential, and a new
    page ticket prevents an older response from drawing into a replaced page.

    @param kind Photo or video collection identifier.

    @return Promise<void> - Completes after the current page and its previews are processed.
*/
async function loadLibraryPage(kind) {
    if (libraryPages[kind].busy || uploading || videoBusy) {
        return;
    }
    const state = libraryPages[kind];
    const ticket = ++state.ticket;
    const message = document.getElementById(kind + '-library-status');
    state.busy = true;
    message.textContent = 'Loading…';
    try {
        let operation = 10;
        let previewOperation = 14;
        let listField = 'photos';
        if (kind === 'video') {
            operation = 16;
            previewOperation = 19;
            listField = 'videos';
        }
        const cursor = state.history[state.history.length - 1];
        const page = await libraryRequest(operation, 0, cursor);
        if (!Array.isArray(page[listField]) || page[listField].length > 10 || !Number.isInteger(page.count)) {
            throw new Error('Incomplete library response.');
        }
        state.nextAfter = page.nextAfter;
        state.hasMore = page.hasMore;
        const cards = page[listField].map(item => createLibraryCard(kind, item, page.displayed));
        document.getElementById(kind + '-library').replaceChildren(...cards.map(item => item.card));
        document.getElementById(kind + '-library-count').textContent = page.count + ' saved';
        document.getElementById(kind + '-page').textContent = state.history.length;
        if (kind === 'photo') {
            document.getElementById('slideshow-enabled').checked = page.slideshow;
            document.getElementById('slideshow-minutes').value = page.intervalSeconds / 60;
        }
        for (let index = 0; index < cards.length; index++) {
            if (ticket !== state.ticket || uploading || videoBusy) {
                return;
            }
            try {
                renderLibraryPreview(cards[index].canvas, await libraryRequest(previewOperation, page[listField][index].id));
            } catch (error) {
                cards[index].canvas.setAttribute('aria-label', 'Preview unavailable: ' + error.message);
            }
        }
        message.textContent = '';
    } catch (error) {
        message.textContent = 'Could not load library: ' + error.message;
    } finally {
        state.busy = false;
        document.getElementById(kind + '-previous').disabled = state.history.length <= 1;
        document.getElementById(kind + '-next').disabled = !state.hasMore;
    }
}

/**
    Requests the preceding or next bounded saved-media page.

    @param kind Photo or video collection identifier.
    @param forward True selects the next cursor; false returns to the previous cursor.
*/
function changeLibraryPage(kind, forward) {
    if (galleryBusy || libraryPages[kind].busy || uploading || videoBusy) {
        return;
    }
    const state = libraryPages[kind];
    if (forward && state.hasMore) {
        state.history.push(state.nextAfter);
    } else if (!forward && state.history.length > 1) {
        state.history.pop();
    } else {
        return;
    }
    loadLibraryPage(kind);
}

/**
    Selects or deletes one saved item, then reloads its current collection page.

    @param kind Photo or video collection identifier.
    @param action Show or delete operation chosen by the user.
    @param id Saved item identifier.

    @return Promise<void> - Completes after the action and refreshed page, or displays an error.
*/
async function libraryAction(kind, action, id) {
    if (galleryBusy || uploading || videoBusy) {
        return;
    }
    galleryBusy = true;
    let succeeded = false;
    try {
        let operation = 11;
        if (kind === 'video') {
            operation = 17;
        }
        if (action === 'delete') {
            operation += 2;
            if (kind === 'video') {
                operation = 18;
            }
        }
        await libraryRequest(operation, id);
        libraryPages[kind].history = [0];
        succeeded = true;
    } catch (error) {
        document.getElementById(kind + '-library-status').textContent = error.message;
    } finally {
        galleryBusy = false;
    }
    if (succeeded) {
        await loadLibraryPage(kind);
    }
}

/**
    Saves the slideshow switch and its user-facing interval in minutes.

    @return Promise<void> - Completes after persisting settings or showing an error.
*/
async function applySlideshow() {
    if (uploading || videoBusy || galleryBusy) {
        return;
    }
    try {
        const seconds = Math.round(Number(document.getElementById('slideshow-minutes').value) * 60);
        if (!Number.isInteger(seconds) || seconds < 6 || seconds > 86400) {
            throw new Error('Choose an interval from 0.1 to 1440 minutes.');
        }
        let enabled = 0;
        if (document.getElementById('slideshow-enabled').checked) {
            enabled = 1;
        }
        await libraryRequest(12, enabled, seconds);
        await loadLibraryPage('photo');
    } catch (error) {
        document.getElementById('photo-library-status').textContent = error.message;
    }
}

/**
    Saves the panel brightness and optional playback FPS cap.

    @return Promise<void> - Completes after applying saved controls or showing an error.
*/
async function applyDisplaySettings() {
    if (uploading || videoBusy) {
        return;
    }
    try {
        const fpsText = document.getElementById('playback-max-fps').value.trim();
        let fps = 0;
        if (fpsText) {
            fps = Number(fpsText);
        }
        const brightness = Number(document.getElementById('panel-brightness').value);
        if (!Number.isInteger(fps) || fps < 0 || fps > 60 || !Number.isInteger(brightness) || brightness < 0 || brightness > 100) {
            throw new Error('Choose FPS 1–60 or leave blank, and brightness 0–100.');
        }
        renderPlaybackStatus(await libraryRequest(21, fps, brightness));
        document.getElementById('summary-status').textContent = 'Settings saved.';
    } catch (error) {
        document.getElementById('summary-status').textContent = error.message;
    }
}

for (const name of ['summary', 'photos', 'videos']) {
    document.getElementById('tab-' + name).addEventListener('click', () => selectMediaTab(name));
    document.getElementById('tab-' + name).addEventListener('keydown', event => {
        const names = ['summary', 'photos', 'videos'];
        let target = names.indexOf(name);
        if (event.key === 'ArrowRight') {
            target = (target + 1) % names.length;
        } else if (event.key === 'ArrowLeft') {
            target = (target + names.length - 1) % names.length;
        } else if (event.key === 'Home') {
            target = 0;
        } else if (event.key === 'End') {
            target = names.length - 1;
        } else {
            return;
        }
        event.preventDefault();
        selectMediaTab(names[target]);
        document.getElementById('tab-' + names[target]).focus();
    });
}
for (const kind of ['photo', 'video']) {
    document.getElementById(kind + '-refresh').addEventListener('click', () => loadLibraryPage(kind));
    document.getElementById(kind + '-previous').addEventListener('click', () => changeLibraryPage(kind, false));
    document.getElementById(kind + '-next').addEventListener('click', () => changeLibraryPage(kind, true));
}
document.getElementById('summary-refresh').addEventListener('click', refreshSummary);
document.getElementById('display-settings-save').addEventListener('click', applyDisplaySettings);
document.getElementById('slideshow-save').addEventListener('click', applySlideshow);
updateVideoControls();
selectMediaTab('summary');

</script>
